<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COSMIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <div class="hud-esquina hud-esquina--tl"></div>
    <div class="hud-esquina hud-esquina--tr"></div>
    <div class="hud-esquina hud-esquina--bl"></div>
    <div class="hud-esquina hud-esquina--br"></div>

    <header class="hud-header">
      <h1 class="hud-titulo">COSMIC</h1>
      <label class="switch">
        <input type="checkbox" id="voz-toggle" checked>
        <span>VOZ</span>
      </label>
    </header>

    <div class="orb-wrap">
      <div id="orb" class="orb" data-estado="idle">
        <div class="orb-radios"></div>
        <div class="orb-anillo orb-anillo--3"></div>
        <div class="orb-anillo orb-anillo--1"></div>
        <div class="orb-anillo orb-anillo--2"></div>
        <div class="orb-barrido"></div>
        <div class="orb-nucleo"></div>
      </div>
      <span id="orb-label" class="orb-label">en reposo</span>
    </div>

    <div id="reproductor-wrap" class="reproductor-wrap oculto">
      <div id="reproductor" class="reproductor"></div>
      <button type="button" id="btn-cerrar-reproductor" class="btn-cerrar-reproductor" title="Cerrar reproductor">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path d="M5 5 L19 19 M19 5 L5 19" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <main id="chat" class="chat"></main>

    <form id="form-mensaje" class="input-bar">
      <button type="button" id="btn-mic" class="btn-mic" title="Hablar">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M6 11a6 6 0 0 0 12 0M12 19v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <input type="text" id="input-texto" placeholder="ESCRIBÍ O TOCÁ EL MICRÓFONO..." autocomplete="off">
      <button type="submit" class="btn-enviar">ENVIAR</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
